<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 516" width="760" height="516" role="img" aria-labelledby="om2-title om2-desc">
  <title id="om2-title">Phase dispatch sequence</title>
  <desc id="om2-desc">Sequence diagram of one phase dispatch with five participants: Project root, Project adapter, Dispatch engine, Run record in implementation.md, and Phase implementer. In order: the root sends the phase plus lifecycle authority to the adapter; the adapter sends a provider-neutral dispatch request to the engine; the engine replies to the root with the exact route and request ID; the root sends the Phase Scope to the phase implementer; the root writes the accepted or blocked-before-start result to the run record; the phase implementer replies to the root with its phase report and commits.</desc>
  <style>
    svg {
      --bg: #161d27;
      --node: #1d2633;
      --node-em: #1f2d42;
      --border: #2b3646;
      --text: #dde4ee;
      --text-2: #9ba7b8;
      --accent: #8fb6ee;
      --optional: #8693a5;
      --warn: #f0a868;
    }
    .canvas { fill: var(--bg); }
    .node { fill: var(--node); stroke: var(--border); stroke-width: 1.5; }
    .node-em { fill: var(--node-em); stroke: var(--accent); stroke-width: 1.5; }
    .edge { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .edge-opt { fill: none; stroke: var(--optional); stroke-width: 1.5; stroke-dasharray: 5 4; stroke-linecap: round; stroke-linejoin: round; }
    .arrow { fill: var(--accent); }
    .arrow-opt { fill: var(--optional); }
    .label-bg { fill: var(--bg); }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
    .t { fill: var(--text); font-size: 15px; font-weight: 600; }
    .s { fill: var(--text-2); font-size: 13px; }
    .lifeline { fill: none; stroke: var(--border); stroke-width: 1.5; }
    .lbl { fill: var(--text); font-size: 13px; }
  </style>
  <defs>
    <marker id="om2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path class="arrow" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
    <marker id="om2-arrow-opt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path class="arrow-opt" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="760" height="516" rx="12" ry="12"/>

  <!-- Lifelines -->
  <path class="lifeline" d="M 86 88 V 492"/>
  <path class="lifeline" d="M 234 88 V 492"/>
  <path class="lifeline" d="M 382 88 V 492"/>
  <path class="lifeline" d="M 530 88 V 492"/>
  <path class="lifeline" d="M 678 88 V 492"/>

  <!-- Messages, top to bottom (edges before nodes) -->
  <!-- 1. Root to Adapter -->
  <path class="edge" d="M 86 160 H 233" marker-end="url(#om2-arrow)"/>
  <rect class="label-bg" x="92" y="118" width="135" height="36" rx="4" ry="4"/>
  <text class="sans lbl" x="160" y="132" text-anchor="middle">Phase + lifecycle</text>
  <text class="sans lbl" x="160" y="148" text-anchor="middle">authority</text>
  <!-- 2. Adapter to Engine -->
  <path class="edge" d="M 234 230 H 381" marker-end="url(#om2-arrow)"/>
  <rect class="label-bg" x="244" y="188" width="128" height="36" rx="4" ry="4"/>
  <text class="sans lbl" x="308" y="202" text-anchor="middle">Provider-neutral</text>
  <text class="sans lbl" x="308" y="218" text-anchor="middle">dispatch request</text>
  <!-- 3. Engine replies to Root -->
  <path class="edge-opt" d="M 382 290 H 87" marker-end="url(#om2-arrow-opt)"/>
  <rect class="label-bg" x="142" y="264" width="184" height="20" rx="4" ry="4"/>
  <text class="sans lbl" x="234" y="278" text-anchor="middle">Exact route + request ID</text>
  <!-- 4. Root to Phase -->
  <path class="edge" d="M 86 346 H 677" marker-end="url(#om2-arrow)"/>
  <rect class="label-bg" x="336" y="320" width="93" height="20" rx="4" ry="4"/>
  <text class="sans lbl" x="382" y="334" text-anchor="middle">Phase Scope</text>
  <!-- 5. Root to Record -->
  <path class="edge" d="M 86 402 H 529" marker-end="url(#om2-arrow)"/>
  <rect class="label-bg" x="164" y="376" width="289" height="20" rx="4" ry="4"/>
  <text class="sans lbl" x="308" y="390" text-anchor="middle">Accepted or blocked-before-start result</text>
  <!-- 6. Phase replies to Root -->
  <path class="edge-opt" d="M 678 458 H 87" marker-end="url(#om2-arrow-opt)"/>
  <rect class="label-bg" x="297" y="432" width="170" height="20" rx="4" ry="4"/>
  <text class="sans lbl" x="382" y="446" text-anchor="middle">Phase report + commits</text>

  <!-- Participants -->
  <rect class="node-em" x="16" y="28" width="140" height="60" rx="8" ry="8"/>
  <text class="sans t" x="86" y="63" text-anchor="middle">Project root</text>
  <rect class="node" x="164" y="28" width="140" height="60" rx="8" ry="8"/>
  <text class="sans t" x="234" y="63" text-anchor="middle">Project adapter</text>
  <rect class="node" x="312" y="28" width="140" height="60" rx="8" ry="8"/>
  <text class="sans t" x="382" y="63" text-anchor="middle">Dispatch engine</text>
  <rect class="node" x="460" y="28" width="140" height="60" rx="8" ry="8"/>
  <text class="sans t" x="530" y="54" text-anchor="middle">Run record in</text>
  <text class="mono s" x="530" y="75" text-anchor="middle">implementation.md</text>
  <rect class="node" x="608" y="28" width="140" height="60" rx="8" ry="8"/>
  <text class="sans t" x="678" y="54" text-anchor="middle">Phase</text>
  <text class="sans t" x="678" y="74" text-anchor="middle">implementer</text>
</svg>
