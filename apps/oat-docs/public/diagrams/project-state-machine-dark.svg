<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 896" width="760" height="896" role="img" aria-labelledby="psm-title psm-desc">
  <title id="psm-title">Project state machine by phase</title>
  <desc id="psm-desc">Project state machine grouped by phase. Planning: Discovery in progress, Ready for spec, Spec in progress, Ready for design, Design in progress, Ready for plan, Plan in progress, Ready for implement, in that order. Two dashed edges labeled entry point lead into Plan in progress: one from Lite: batched interview (no discovery/spec/design), one from Brief or goal: interview (one Project Brief). Implementation: Ready for implement leads to Implement in progress, which leads to Implement complete. Review, in the plan.md Reviews table: Implement in progress leads to Review received; Review received leads to Fixes added when fixes are queued, or to Review passed when no fixes are queued; Fixes added leads to Fixes completed; a re-review then adds a new row, so Fixes completed leads back to Review received (edge labeled re-review: new row); Review passed leads back to Implement in progress. PR and revision: Implement complete leads to PR open (pr_open); PR open leads to Revise (in_progress), which leads back to PR open; PR open leads to Complete.</desc>
  <style>
    svg {
      --bg: #161d27;
      --node: #1d2633;
      --node-em: #1f2d42;
      --border: #2b3646;
      --text: #dde4ee;
      --text-2: #9ba7b8;
      --accent: #8fb6ee;
      --optional: #8693a5;
      --warn: #f0a868;
    }
    .canvas { fill: var(--bg); }
    .node { fill: var(--node); stroke: var(--border); stroke-width: 1.5; }
    .node-em { fill: var(--node-em); stroke: var(--accent); stroke-width: 1.5; }
    .edge { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .edge-opt { fill: none; stroke: var(--optional); stroke-width: 1.5; stroke-dasharray: 5 4; stroke-linecap: round; stroke-linejoin: round; }
    .arrow { fill: var(--accent); }
    .arrow-opt { fill: var(--optional); }
    .label-bg { fill: var(--bg); }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
    .t { fill: var(--text); font-size: 15px; font-weight: 600; }
    .s { fill: var(--text-2); font-size: 13px; }
    .group { fill: none; stroke: var(--border); stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="psm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path class="arrow" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
    <marker id="psm-arrow-opt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path class="arrow-opt" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="760" height="896" rx="12" ry="12"/>

  <!-- Phase groups -->
  <rect class="group" x="12" y="16" width="736" height="370" rx="10" ry="10"/>
  <text class="sans s" x="28" y="40">Planning</text>
  <rect class="group" x="12" y="402" width="736" height="104" rx="10" ry="10"/>
  <text class="sans s" x="28" y="426">Implementation</text>
  <rect class="group" x="12" y="522" width="736" height="178" rx="10" ry="10"/>
  <text class="sans s" x="28" y="546">Review (plan.md Reviews table)</text>
  <rect class="group" x="12" y="716" width="736" height="164" rx="10" ry="10"/>
  <text class="sans s" x="28" y="740">PR and revision</text>

  <!-- Edges (drawn first so nodes sit on top) -->
  <g class="edges">
    <!-- D -> RS -->
    <path class="edge" d="M 508 74 H 547" marker-end="url(#psm-arrow)"/>
    <!-- RS -> S -->
    <path class="edge" d="M 644 96 V 104 Q 644 108 640 108 H 418 Q 414 108 414 112 V 119" marker-end="url(#psm-arrow)"/>
    <!-- S -> RD -->
    <path class="edge" d="M 508 142 H 547" marker-end="url(#psm-arrow)"/>
    <!-- RD -> G -->
    <path class="edge" d="M 644 164 V 172 Q 644 176 640 176 H 418 Q 414 176 414 180 V 187" marker-end="url(#psm-arrow)"/>
    <!-- G -> RP -->
    <path class="edge" d="M 508 210 H 547" marker-end="url(#psm-arrow)"/>
    <!-- RP -> P -->
    <path class="edge" d="M 644 232 V 240 Q 644 244 640 244 H 418 Q 414 244 414 248 V 255" marker-end="url(#psm-arrow)"/>
    <!-- P -> RI -->
    <path class="edge" d="M 508 278 H 547" marker-end="url(#psm-arrow)"/>
    <!-- RI -> I -->
    <path class="edge" d="M 644 300 V 390 Q 644 394 640 394 H 418 Q 414 394 414 398 V 437" marker-end="url(#psm-arrow)"/>
    <!-- I -> IC -->
    <path class="edge" d="M 508 460 H 547" marker-end="url(#psm-arrow)"/>
    <!-- I -> RV -->
    <path class="edge" d="M 414 482 V 555" marker-end="url(#psm-arrow)"/>
    <!-- RV -> FA (fixes queued) -->
    <path class="edge" d="M 320 578 H 221" marker-end="url(#psm-arrow)"/>
    <!-- RV -> PASSED (no fixes queued) -->
    <path class="edge" d="M 414 600 V 639" marker-end="url(#psm-arrow)"/>
    <!-- FA -> FC -->
    <path class="edge" d="M 134 600 V 639" marker-end="url(#psm-arrow)"/>
    <!-- FC -> RV (re-review: new row) -->
    <path class="edge" d="M 220 662 H 262 Q 270 662 270 654 V 600 Q 270 592 278 592 H 319" marker-end="url(#psm-arrow)"/>
    <!-- PASSED -> I -->
    <path class="edge" d="M 508 662 H 520 Q 528 662 528 654 V 502 Q 528 494 520 494 H 474 Q 470 494 470 490 V 483" marker-end="url(#psm-arrow)"/>
    <!-- IC -> PRO -->
    <path class="edge" d="M 644 482 V 751" marker-end="url(#psm-arrow)"/>
    <!-- PRO -> REV -->
    <path class="edge" d="M 548 766 H 509" marker-end="url(#psm-arrow)"/>
    <!-- REV -> PRO -->
    <path class="edge" d="M 508 782 H 547" marker-end="url(#psm-arrow)"/>
    <!-- PRO -> C -->
    <path class="edge" d="M 644 796 V 819" marker-end="url(#psm-arrow)"/>
    <!-- LITE -> P (entry point) -->
    <path class="edge-opt" d="M 220 270 H 319" marker-end="url(#psm-arrow-opt)"/>
    <!-- BRIEF -> P (entry point) -->
    <path class="edge-opt" d="M 220 342 H 262 Q 270 342 270 334 V 298 Q 270 290 278 290 H 319" marker-end="url(#psm-arrow-opt)"/>
  </g>

  <!-- Edge labels -->
  <text class="sans s" x="270" y="262" text-anchor="middle">entry point</text>
  <text class="sans s" x="278" y="330">entry point</text>
  <text class="sans s" x="270" y="570" text-anchor="middle">fixes queued</text>
  <text class="sans s" x="422" y="624" text-anchor="start">no fixes queued</text>
  <text class="sans s" x="278" y="626" text-anchor="start">re-review: new row</text>

  <!-- Nodes -->
  <!-- D -->
  <rect class="node" x="320" y="52" width="188" height="44" rx="8" ry="8"/>
  <text class="sans t" x="414" y="79" text-anchor="middle">Discovery in progress</text>
  <!-- RS -->
  <rect class="node" x="548" y="52" width="192" height="44" rx="8" ry="8"/>
  <text class="sans t" x="644" y="79" text-anchor="middle">Ready for spec</text>
  <!-- S -->
  <rect class="node" x="320" y="120" width="188" height="44" rx="8" ry="8"/>
  <text class="sans t" x="414" y="147" text-anchor="middle">Spec in progress</text>
  <!-- RD -->
  <rect class="node" x="548" y="120" width="192" height="44" rx="8" ry="8"/>
  <text class="sans t" x="644" y="147" text-anchor="middle">Ready for design</text>
  <!-- G -->
  <rect class="node" x="320" y="188" width="188" height="44" rx="8" ry="8"/>
  <text class="sans t" x="414" y="215" text-anchor="middle">Design in progress</text>
  <!-- RP -->
  <rect class="node" x="548" y="188" width="192" height="44" rx="8" ry="8"/>
  <text class="sans t" x="644" y="215" text-anchor="middle">Ready for plan</text>
  <!-- P -->
  <rect class="node" x="320" y="256" width="188" height="44" rx="8" ry="8"/>
  <text class="sans t" x="414" y="283" text-anchor="middle">Plan in progress</text>
  <!-- RI -->
  <rect class="node" x="548" y="256" width="192" height="44" rx="8" ry="8"/>
  <text class="sans t" x="644" y="283" text-anchor="middle">Ready for implement</text>
  <!-- LITE -->
  <rect class="node" x="24" y="242" width="196" height="56" rx="8" ry="8"/>
  <text class="sans t" x="122" y="266" text-anchor="middle">Lite: batched interview</text>
  <text class="sans s" x="122" y="286" text-anchor="middle">(no discovery/spec/design)</text>
  <!-- BRIEF -->
  <rect class="node" x="24" y="314" width="196" height="56" rx="8" ry="8"/>
  <text class="sans t" x="122" y="338" text-anchor="middle">Brief or goal: interview</text>
  <text class="sans s" x="122" y="358" text-anchor="middle">(one Project Brief)</text>
  <!-- I -->
  <rect class="node-em" x="320" y="438" width="188" height="44" rx="8" ry="8"/>
  <text class="sans t" x="414" y="465" text-anchor="middle">Implement in progress</text>
  <!-- IC -->
  <rect class="node" x="548" y="438" width="192" height="44" rx="8" ry="8"/>
  <text class="sans t" x="644" y="465" text-anchor="middle">Implement complete</text>
  <!-- RV -->
  <rect class="node" x="320" y="556" width="188" height="44" rx="8" ry="8"/>
  <text class="sans t" x="414" y="583" text-anchor="middle">Review received</text>
  <!-- FA -->
  <rect class="node" x="48" y="556" width="172" height="44" rx="8" ry="8"/>
  <text class="sans t" x="134" y="583" text-anchor="middle">Fixes added</text>
  <!-- FC -->
  <rect class="node" x="48" y="640" width="172" height="44" rx="8" ry="8"/>
  <text class="sans t" x="134" y="667" text-anchor="middle">Fixes completed</text>
  <!-- PASSED -->
  <rect class="node" x="320" y="640" width="188" height="44" rx="8" ry="8"/>
  <text class="sans t" x="414" y="667" text-anchor="middle">Review passed</text>
  <!-- REV -->
  <rect class="node" x="320" y="752" width="188" height="44" rx="8" ry="8"/>
  <text class="sans t" x="414" y="779" text-anchor="middle">Revise (in_progress)</text>
  <!-- PRO -->
  <rect class="node" x="548" y="752" width="192" height="44" rx="8" ry="8"/>
  <text class="sans t" x="644" y="779" text-anchor="middle">PR open (pr_open)</text>
  <!-- C -->
  <rect class="node" x="548" y="820" width="192" height="44" rx="8" ry="8"/>
  <text class="sans t" x="644" y="847" text-anchor="middle">Complete</text>
</svg>
