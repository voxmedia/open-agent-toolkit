<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 508" width="760" height="508" role="img" aria-labelledby="el-title el-desc">
  <title id="el-title">Three evidence layers</title>
  <desc id="el-desc">Layer 1, policy resolution (named ceiling, candidates, capped/uncapped mode), leads to Layer 2, launcher-owned configured invocation (route, target/model/effort axes, selection reason, candidates considered, launch acceptance), which leads to Layer 3, runtime-observed identity, optional (producer + model, only under trusted provenance). Assertions assert on Layer 1 and Layer 2, and only record Layer 3 (dashed edge). Layer 3 leads to reported (both present + trusted provenance) or not-reported (anything else normalizes here).</desc>
  <style>
    svg {
      --bg: #161d27;
      --node: #1d2633;
      --node-em: #1f2d42;
      --border: #2b3646;
      --text: #dde4ee;
      --text-2: #9ba7b8;
      --accent: #8fb6ee;
      --optional: #8693a5;
    }
    .canvas { fill: var(--bg); }
    .node { fill: var(--node); stroke: var(--border); stroke-width: 1.5; }
    .node-em { fill: var(--node-em); stroke: var(--accent); stroke-width: 1.5; }
    .edge { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .edge-opt { fill: none; stroke: var(--optional); stroke-width: 1.5; stroke-dasharray: 5 4; stroke-linejoin: round; }
    .arrow { fill: var(--accent); }
    .arrow-opt { fill: var(--optional); }
    .label-bg { fill: var(--bg); }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
    .t { fill: var(--text); font-size: 15px; font-weight: 600; }
    .s { fill: var(--text-2); font-size: 13px; }
    .el { fill: var(--text-2); font-size: 13px; }
  </style>
  <defs>
    <marker id="el-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path class="arrow" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
    <marker id="el-arrow-opt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path class="arrow-opt" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="760" height="508" rx="12" ry="12"/>

  <!-- Edges (drawn first so nodes sit on top) -->
  <g class="edges">
    <!-- L1 -> L2 -->
    <path class="edge" d="M 510 100 L 510 147" marker-end="url(#el-arrow)"/>
    <!-- L2 -> L3 -->
    <path class="edge" d="M 510 236 L 510 283" marker-end="url(#el-arrow)"/>
    <!-- A -assert on-> L1 -->
    <path class="edge" d="M 152 172 L 172 172 Q 180 172 180 164 L 180 74 Q 180 66 188 66 L 289 66" marker-end="url(#el-arrow)"/>
    <!-- A -assert on-> L2 -->
    <path class="edge" d="M 152 192 L 289 192" marker-end="url(#el-arrow)"/>
    <!-- A -.-record only-> L3 -->
    <path class="edge-opt" d="M 152 212 L 172 212 Q 180 212 180 220 L 180 310 Q 180 318 188 318 L 289 318" marker-end="url(#el-arrow-opt)"/>
    <!-- L3 -> R -->
    <path class="edge" d="M 486 352 L 486 372 Q 486 380 478 380 L 338 380 Q 330 380 330 388 L 330 407" marker-end="url(#el-arrow)"/>
    <!-- L3 -> NR -->
    <path class="edge" d="M 534 352 L 534 372 Q 534 380 542 380 L 595 380 Q 603 380 603 388 L 603 407" marker-end="url(#el-arrow)"/>
  </g>

  <!-- Edge labels -->
  <rect class="label-bg" x="202" y="55" width="72" height="22" rx="4" ry="4"/>
  <text class="sans el" x="238" y="70.5" text-anchor="middle">assert on</text>
  <rect class="label-bg" x="202" y="181" width="72" height="22" rx="4" ry="4"/>
  <text class="sans el" x="238" y="196.5" text-anchor="middle">assert on</text>
  <rect class="label-bg" x="194" y="307" width="88" height="22" rx="4" ry="4"/>
  <text class="sans el" x="238" y="322.5" text-anchor="middle">record only</text>

  <!-- A: Assertions -->
  <rect class="node-em" x="32" y="156" width="120" height="72" rx="8" ry="8"/>
  <text class="sans t" x="92" y="197" text-anchor="middle">Assertions</text>

  <!-- L1: Layer 1 — Policy resolution -->
  <rect class="node" x="290" y="32" width="440" height="68" rx="8" ry="8"/>
  <text class="sans t" x="510" y="61" text-anchor="middle">Layer 1 — Policy resolution</text>
  <text class="sans s" x="510" y="83" text-anchor="middle">named ceiling · candidates · capped/uncapped mode</text>

  <!-- L2: Layer 2 — Launcher-owned configured invocation -->
  <rect class="node" x="290" y="148" width="440" height="88" rx="8" ry="8"/>
  <text class="sans t" x="510" y="177" text-anchor="middle">Layer 2 — Launcher-owned configured invocation</text>
  <text class="sans s" x="510" y="199" text-anchor="middle">route · target/model/effort axes · selection reason ·</text>
  <text class="sans s" x="510" y="219" text-anchor="middle">candidates considered · launch acceptance</text>

  <!-- L3: Layer 3 — Runtime-observed identity (optional) -->
  <rect class="node" x="290" y="284" width="440" height="68" rx="8" ry="8"/>
  <text class="sans t" x="510" y="313" text-anchor="middle">Layer 3 — Runtime-observed identity (optional)</text>
  <text class="sans s" x="510" y="335" text-anchor="middle">producer + model, only under trusted provenance</text>

  <!-- R: reported -->
  <rect class="node" x="205" y="408" width="250" height="68" rx="8" ry="8"/>
  <text class="mono t" x="330" y="437" text-anchor="middle">reported</text>
  <text class="sans s" x="330" y="459" text-anchor="middle">(both present + trusted provenance)</text>

  <!-- NR: not-reported -->
  <rect class="node" x="478" y="408" width="250" height="68" rx="8" ry="8"/>
  <text class="mono t" x="603" y="437" text-anchor="middle">not-reported</text>
  <text class="sans s" x="603" y="459" text-anchor="middle">(anything else normalizes here)</text>
</svg>
