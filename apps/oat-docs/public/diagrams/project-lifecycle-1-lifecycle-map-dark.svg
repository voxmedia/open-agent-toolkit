<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 834" width="680" height="834" role="img" aria-labelledby="title desc">
  <title id="title">OAT project lifecycle map</title>
  <desc id="desc">Spec-driven default lifecycle: Discovery, then Spec, Design, Plan, Implement (oat-project-implement), Review loop, PR flow, Docs sync (optional), and Complete, in sequence.</desc>
  <style>
    svg {
      --bg: #161d27;
      --node: #1d2633;
      --node-em: #1f2d42;
      --border: #2b3646;
      --text: #dde4ee;
      --text-2: #9ba7b8;
      --accent: #8fb6ee;
      --muted: #8693a5;
      --warn: #f0a868;
    }
    .bg { fill: var(--bg); }
    .node { fill: var(--node); stroke: var(--border); stroke-width: 1.5; }
    .node-em { fill: var(--node-em); stroke: var(--border); stroke-width: 1.5; }
    .decision { fill: var(--node-em); stroke: var(--accent); stroke-width: 1.5; }
    .group { fill: none; stroke: var(--border); stroke-width: 1.5; }
    .edge { fill: none; stroke: var(--accent); stroke-width: 1.5; }
    .arrowhead { fill: var(--accent); }
    .label-bg { fill: var(--bg); }
    .t { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 500; fill: var(--text); }
    .t2 { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: var(--text-2); }
    .m { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 15px; font-weight: 500; fill: var(--text); }
    .m2 { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 13px; fill: var(--text-2); }
    .el { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: var(--text-2); }
    .gl { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; fill: var(--text-2); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="680" height="834" rx="12"/>
  <path class="edge" d="M340,80 L340,119" marker-end="url(#arrow)"/>
  <path class="edge" d="M340,168 L340,207" marker-end="url(#arrow)"/>
  <path class="edge" d="M340,256 L340,295" marker-end="url(#arrow)"/>
  <path class="edge" d="M340,344 L340,383" marker-end="url(#arrow)"/>
  <path class="edge" d="M340,450 L340,489" marker-end="url(#arrow)"/>
  <path class="edge" d="M340,538 L340,577" marker-end="url(#arrow)"/>
  <path class="edge" d="M340,626 L340,665" marker-end="url(#arrow)"/>
  <path class="edge" d="M340,714 L340,753" marker-end="url(#arrow)"/>
  <rect class="node-em" x="200" y="32" width="280" height="48" rx="8"/>
  <text class="t" x="340" y="61" text-anchor="middle">Discovery</text>
  <rect class="node" x="200" y="120" width="280" height="48" rx="8"/>
  <text class="t" x="340" y="149" text-anchor="middle">Spec</text>
  <rect class="node" x="200" y="208" width="280" height="48" rx="8"/>
  <text class="t" x="340" y="237" text-anchor="middle">Design</text>
  <rect class="node" x="200" y="296" width="280" height="48" rx="8"/>
  <text class="t" x="340" y="325" text-anchor="middle">Plan</text>
  <rect class="node" x="200" y="384" width="280" height="66" rx="8"/>
  <text class="t" x="340" y="413" text-anchor="middle">Implement</text>
  <text class="m2" x="340" y="431" text-anchor="middle">(oat-project-implement)</text>
  <rect class="node" x="200" y="490" width="280" height="48" rx="8"/>
  <text class="t" x="340" y="519" text-anchor="middle">Review loop</text>
  <rect class="node" x="200" y="578" width="280" height="48" rx="8"/>
  <text class="t" x="340" y="607" text-anchor="middle">PR flow</text>
  <rect class="node" x="200" y="666" width="280" height="48" rx="8"/>
  <text class="t" x="340" y="695" text-anchor="middle">Docs sync (optional)</text>
  <rect class="node" x="200" y="754" width="280" height="48" rx="8"/>
  <text class="t" x="340" y="783" text-anchor="middle">Complete</text>
</svg>
