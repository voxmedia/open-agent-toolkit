<text class="title" x="453" y="314">Backlog item</text>
<text class="path" x="453" y="336">.oat/repo/pjm/</text>
<text class="path" x="453" y="354">backlog/items/</text>
<rect class="node" x="44" y="440" width="206" height="84" rx="8"/>
<text class="title" x="147" y="464">Summarized idea</text>
<text class="path" x="147" y="486">.oat/ideas/{idea}/</text>
<text class="path" x="147" y="504">summary.md</text>
<rect class="node em" x="110" y="590" width="380" height="84" rx="8"/>
<text class="title" x="300" y="614">Project</text>
<text class="path" x="300" y="636">.oat/projects/</text>
<text class="path" x="300" y="654">{scope}/{slug}/</text>
<rect class="node" x="190" y="740" width="220" height="64" rx="8"/>
<text class="title" x="300" y="762">Parent +</text>
<text class="title" x="300" y="782">child projects</text>
</g>
