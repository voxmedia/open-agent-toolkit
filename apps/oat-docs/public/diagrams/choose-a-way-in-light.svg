<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" width="720" height="680" role="img" aria-labelledby="cw-title cw-desc">
  <title id="cw-title">Ways into the shared lifecycle</title>
  <desc id="cw-desc">Ways in on the left, the shared project lifecycle on the right (Discovery, Spec, Design, Plan, Implement, Review, PR, Complete). Spec-driven (oat-project-new) and quick (oat-project-quick-start) join at Discovery; quick skips the spec and has an optional design. Lite, brief, goal and import each join at Plan, which writes plan.md. Capture (oat-project-capture) records work already done as a quick-mode project: when the work is ready it joins at Review, for a review or a PR directly. Work still in progress keeps going, then re-runs capture or uses oat-project-reconcile. No project stays outside the lifecycle: ask your agent or run CLI commands, with nothing to resume.</desc>
  <style>
    svg {
      --bg: #ffffff;
      --node: #f4f6f9;
      --node-em: #e8eef7;
      --border: #c9d1dc;
      --text: #16202e;
      --text-2: #4b5563;
      --accent: #1b4f8a;
      --optional: #5d6a7c;
      --warn: #a14a08;
    }
    .canvas { fill: var(--bg); }
    .node { fill: var(--node); stroke: var(--border); stroke-width: 1.5; }
    .node-em { fill: var(--node-em); stroke: var(--accent); stroke-width: 1.5; }
    .node-opt { fill: var(--node); stroke: var(--optional); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .edge { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .edge-opt { fill: none; stroke: var(--optional); stroke-width: 1.5; stroke-dasharray: 5 4; stroke-linejoin: round; }
    .arrow { fill: var(--accent); }
    .arrow-opt { fill: var(--optional); }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
    .t { fill: var(--text); font-size: 15px; font-weight: 600; }
    .s { fill: var(--text-2); font-size: 13px; }
    .c { fill: var(--text); font-size: 13px; }
    .el { fill: var(--text-2); font-size: 13px; }
  </style>
  <defs>
    <marker id="cw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path class="arrow" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
    <marker id="cw-arrow-opt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path class="arrow-opt" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="680" rx="12" ry="12"/>

  <!-- Edges (drawn first so nodes sit on top) -->
  <g class="edges">
    <path class="edge" d="M 596 104 L 596 119" marker-end="url(#cw-arrow)"/>
    <path class="edge" d="M 596 172 L 596 187" marker-end="url(#cw-arrow)"/>
    <path class="edge" d="M 596 240 L 596 255" marker-end="url(#cw-arrow)"/>
    <path class="edge" d="M 596 356 L 596 371" marker-end="url(#cw-arrow)"/>
    <path class="edge" d="M 596 424 L 596 439" marker-end="url(#cw-arrow)"/>
    <path class="edge" d="M 596 492 L 596 507" marker-end="url(#cw-arrow)"/>
    <path class="edge" d="M 596 560 L 596 575" marker-end="url(#cw-arrow)"/>
    <!-- spec-driven -> discovery -->
    <path class="edge" d="M 300 78 L 495 78" marker-end="url(#cw-arrow)"/>
    <!-- quick -> discovery -->
    <path class="edge" d="M 300 146 L 372 146 Q 380 146 380 138 L 380 104 Q 380 96 388 96 L 495 96" marker-end="url(#cw-arrow)"/>
    <!-- lite -> plan -->
    <path class="edge" d="M 300 214 L 372 214 Q 380 214 380 222 L 380 260 Q 380 268 388 268 L 495 268" marker-end="url(#cw-arrow)"/>
    <!-- brief -> plan -->
    <path class="edge" d="M 300 288 L 495 288" marker-end="url(#cw-arrow)"/>
    <!-- goal -> plan -->
    <path class="edge" d="M 300 350 L 372 350 Q 380 350 380 342 L 380 316 Q 380 308 388 308 L 495 308" marker-end="url(#cw-arrow)"/>
    <!-- import -> plan -->
    <path class="edge" d="M 300 418 L 392 418 Q 400 418 400 410 L 400 336 Q 400 328 408 328 L 495 328" marker-end="url(#cw-arrow)"/>
    <!-- capture -> review (ready: review, or PR directly) -->
    <path class="edge" d="M 300 500 L 452 500 Q 460 500 460 492 L 460 474 Q 460 466 468 466 L 495 466" marker-end="url(#cw-arrow)"/>
  </g>

  <text class="sans s" x="160" y="36" text-anchor="middle">Way in</text>

  <text class="sans s" x="596" y="36" text-anchor="middle">Shared lifecycle</text>

  <!-- RAIL Discovery -->
  <rect class="node" x="496" y="52" width="200" height="52" rx="8" ry="8"/>
  <text class="sans t" x="596" y="82" text-anchor="middle">Discovery</text>

  <!-- RAIL Spec -->
  <rect class="node" x="496" y="120" width="200" height="52" rx="8" ry="8"/>
  <text class="sans t" x="596" y="150" text-anchor="middle">Spec</text>

  <!-- RAIL Design -->
  <rect class="node" x="496" y="188" width="200" height="52" rx="8" ry="8"/>
  <text class="sans t" x="596" y="218" text-anchor="middle">Design</text>

  <!-- RAIL Plan -->
  <rect class="node-em" x="496" y="256" width="200" height="100" rx="8" ry="8"/>
  <text class="sans t" x="596" y="300" text-anchor="middle">Plan</text>
  <text class="mono s" x="596" y="320" text-anchor="middle">plan.md</text>

  <!-- RAIL Implement -->
  <rect class="node" x="496" y="372" width="200" height="52" rx="8" ry="8"/>
  <text class="sans t" x="596" y="402" text-anchor="middle">Implement</text>

  <!-- RAIL Review -->
  <rect class="node" x="496" y="440" width="200" height="52" rx="8" ry="8"/>
  <text class="sans t" x="596" y="470" text-anchor="middle">Review</text>

  <!-- RAIL PR -->
  <rect class="node" x="496" y="508" width="200" height="52" rx="8" ry="8"/>
  <text class="sans t" x="596" y="538" text-anchor="middle">PR</text>

  <!-- RAIL Complete -->
  <rect class="node" x="496" y="576" width="200" height="52" rx="8" ry="8"/>
  <text class="sans t" x="596" y="606" text-anchor="middle">Complete</text>

  <!-- WAY Spec-driven -->
  <rect class="node" x="20" y="52" width="280" height="52" rx="8" ry="8"/>
  <text class="sans t" x="160" y="72" text-anchor="middle">Spec-driven</text>
  <text class="mono s" x="160" y="92" text-anchor="middle">oat-project-new</text>

  <!-- WAY Quick -->
  <rect class="node" x="20" y="120" width="280" height="52" rx="8" ry="8"/>
  <text class="sans t" x="160" y="140" text-anchor="middle">Quick</text>
  <text class="mono s" x="160" y="160" text-anchor="middle">oat-project-quick-start</text>

  <!-- WAY Lite -->
  <rect class="node" x="20" y="188" width="280" height="52" rx="8" ry="8"/>
  <text class="sans t" x="160" y="208" text-anchor="middle">Lite</text>
  <text class="mono s" x="160" y="228" text-anchor="middle">oat-project-lite</text>

  <!-- WAY Brief -->
  <rect class="node" x="20" y="256" width="280" height="52" rx="8" ry="8"/>
  <text class="sans t" x="160" y="276" text-anchor="middle">Brief</text>
  <text class="mono s" x="160" y="296" text-anchor="middle">oat-project-brief</text>

  <!-- WAY Goal -->
  <rect class="node" x="20" y="324" width="280" height="52" rx="8" ry="8"/>
  <text class="sans t" x="160" y="344" text-anchor="middle">Goal</text>
  <text class="mono s" x="160" y="364" text-anchor="middle">oat-project-goal</text>

  <!-- WAY Import -->
  <rect class="node" x="20" y="392" width="280" height="52" rx="8" ry="8"/>
  <text class="sans t" x="160" y="412" text-anchor="middle">Import</text>
  <text class="mono s" x="160" y="432" text-anchor="middle">oat-project-import-plan</text>

  <!-- WAY No project -->
  <rect class="node" x="20" y="580" width="280" height="52" rx="8" ry="8"/>
  <text class="sans t" x="160" y="600" text-anchor="middle">No project</text>
  <text class="sans s" x="160" y="620" text-anchor="middle">ask your agent or run CLI commands</text>

  <!-- WAY Capture -->
  <rect class="node" x="20" y="460" width="280" height="104" rx="8" ry="8"/>
  <text class="sans t" x="160" y="479" text-anchor="middle">Capture</text>
  <text class="mono s" x="160" y="499" text-anchor="middle">oat-project-capture</text>
  <text class="sans s" x="160" y="517" text-anchor="middle">still in progress: keep working,</text>
  <text class="sans s" x="160" y="535" text-anchor="middle">then re-run capture, or</text>
  <text class="mono s" x="160" y="553" text-anchor="middle">oat-project-reconcile</text>

  <text class="sans el" x="388" y="124" text-anchor="start">no spec,</text>

  <text class="sans el" x="388" y="140" text-anchor="start">design optional</text>

  <text class="sans el" x="310" y="520" text-anchor="start">ready: review,</text>

  <text class="sans el" x="310" y="536" text-anchor="start">or PR directly</text>

  <text class="sans el" x="316" y="612" text-anchor="start">stays outside the lifecycle</text>
</svg>
