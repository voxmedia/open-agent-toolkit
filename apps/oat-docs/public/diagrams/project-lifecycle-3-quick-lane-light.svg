<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" width="680" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Quick lane</title>
  <desc id="desc">Quick lane: Quick Start (adaptive discovery) leads to the decision Design depth?. Straight to plan goes to Plan; Lightweight design goes to Design (quick), then Plan; Promote goes to the Spec-Driven lane. Plan leads to Implement (oat-project-implement), then Review / PR.</desc>
  <style>
    svg {
      --bg: #ffffff;
      --node: #f4f6f9;
      --node-em: #e8eef7;
      --border: #c9d1dc;
      --text: #16202e;
      --text-2: #4b5563;
      --accent: #1b4f8a;
      --muted: #5d6a7c;
      --warn: #a14a08;
    }
    .bg { fill: var(--bg); }
    .node { fill: var(--node); stroke: var(--border); stroke-width: 1.5; }
    .node-em { fill: var(--node-em); stroke: var(--border); stroke-width: 1.5; }
    .decision { fill: var(--node-em); stroke: var(--accent); stroke-width: 1.5; }
    .group { fill: none; stroke: var(--border); stroke-width: 1.5; }
    .edge { fill: none; stroke: var(--accent); stroke-width: 1.5; }
    .arrowhead { fill: var(--accent); }
    .label-bg { fill: var(--bg); }
    .t { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 500; fill: var(--text); }
    .t2 { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: var(--text-2); }
    .m { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 15px; font-weight: 500; fill: var(--text); }
    .m2 { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 13px; fill: var(--text-2); }
    .el { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: var(--text-2); }
    .gl { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; fill: var(--text-2); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="680" height="600" rx="12"/>
  <path class="edge" d="M340,98 L340,137" marker-end="url(#arrow)"/>
  <path class="edge" d="M340,182 L340,325" marker-end="url(#arrow)"/>
  <path class="edge" d="M250,160 L138,160 Q130,160 130,168 L130,237" marker-end="url(#arrow)"/>
  <path class="edge" d="M130,286 L130,342 Q130,350 138,350 L199,350" marker-end="url(#arrow)"/>
  <path class="edge" d="M430,160 L542,160 Q550,160 550,168 L550,237" marker-end="url(#arrow)"/>
  <path class="edge" d="M340,374 L340,413" marker-end="url(#arrow)"/>
  <path class="edge" d="M340,480 L340,519" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="275.5" y="252" width="129" height="20" rx="4"/>
  <text class="el" x="340" y="266.5" text-anchor="middle">Straight to plan</text>
  <rect class="label-bg" x="58" y="193" width="144" height="20" rx="4"/>
  <text class="el" x="130" y="207.5" text-anchor="middle">Lightweight design</text>
  <rect class="label-bg" x="518" y="193" width="64" height="20" rx="4"/>
  <text class="el" x="550" y="207.5" text-anchor="middle">Promote</text>
  <rect class="node-em" x="200" y="32" width="280" height="66" rx="8"/>
  <text class="t" x="340" y="61" text-anchor="middle">Quick Start</text>
  <text class="t2" x="340" y="79" text-anchor="middle">(adaptive discovery)</text>
  <rect class="decision" x="250" y="138" width="180" height="44" rx="22"/>
  <text class="t" x="340" y="165" text-anchor="middle">Design depth?</text>
  <rect class="node" x="30" y="238" width="200" height="48" rx="8"/>
  <text class="t" x="130" y="267" text-anchor="middle">Design (quick)</text>
  <rect class="node" x="450" y="238" width="200" height="48" rx="8"/>
  <text class="t" x="550" y="267" text-anchor="middle">→ Spec-Driven lane</text>
  <rect class="node" x="200" y="326" width="280" height="48" rx="8"/>
  <text class="t" x="340" y="355" text-anchor="middle">Plan</text>
  <rect class="node" x="200" y="414" width="280" height="66" rx="8"/>
  <text class="t" x="340" y="443" text-anchor="middle">Implement</text>
  <text class="m2" x="340" y="461" text-anchor="middle">(oat-project-implement)</text>
  <rect class="node" x="200" y="520" width="280" height="48" rx="8"/>
  <text class="t" x="340" y="549" text-anchor="middle">Review / PR</text>
</svg>
