<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 518" width="680" height="518" role="img" aria-labelledby="title desc">
  <title id="title">Lite lane</title>
  <desc id="desc">Lite lane: Lite interview (one batched round), then Single-phase plan (one approval), Implement (oat-project-implement), Final review, and PR (default closeout). From the plan, Scope grows leads to Promote to Quick.</desc>
  <style>
    svg {
      --bg: #161d27;
      --node: #1d2633;
      --node-em: #1f2d42;
      --border: #2b3646;
      --text: #dde4ee;
      --text-2: #9ba7b8;
      --accent: #8fb6ee;
      --muted: #8693a5;
      --warn: #f0a868;
    }
    .bg { fill: var(--bg); }
    .node { fill: var(--node); stroke: var(--border); stroke-width: 1.5; }
    .node-em { fill: var(--node-em); stroke: var(--border); stroke-width: 1.5; }
    .decision { fill: var(--node-em); stroke: var(--accent); stroke-width: 1.5; }
    .group { fill: none; stroke: var(--border); stroke-width: 1.5; }
    .edge { fill: none; stroke: var(--accent); stroke-width: 1.5; }
    .arrowhead { fill: var(--accent); }
    .label-bg { fill: var(--bg); }
    .t { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 500; fill: var(--text); }
    .t2 { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: var(--text-2); }
    .m { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 15px; font-weight: 500; fill: var(--text); }
    .m2 { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 13px; fill: var(--text-2); }
    .el { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: var(--text-2); }
    .gl { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; fill: var(--text-2); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="680" height="518" rx="12"/>
  <path class="edge" d="M200,98 L200,137" marker-end="url(#arrow)"/>
  <path class="edge" d="M200,204 L200,243" marker-end="url(#arrow)"/>
  <path class="edge" d="M200,310 L200,349" marker-end="url(#arrow)"/>
  <path class="edge" d="M200,398 L200,437" marker-end="url(#arrow)"/>
  <path class="edge" d="M340,171 L479,171" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="363.5" y="161" width="93" height="20" rx="4"/>
  <text class="el" x="410" y="175.5" text-anchor="middle">Scope grows</text>
  <rect class="node-em" x="60" y="32" width="280" height="66" rx="8"/>
  <text class="t" x="200" y="61" text-anchor="middle">Lite interview</text>
  <text class="t2" x="200" y="79" text-anchor="middle">(one batched round)</text>
  <rect class="node" x="60" y="138" width="280" height="66" rx="8"/>
  <text class="t" x="200" y="167" text-anchor="middle">Single-phase plan</text>
  <text class="t2" x="200" y="185" text-anchor="middle">(one approval)</text>
  <rect class="node" x="60" y="244" width="280" height="66" rx="8"/>
  <text class="t" x="200" y="273" text-anchor="middle">Implement</text>
  <text class="m2" x="200" y="291" text-anchor="middle">(oat-project-implement)</text>
  <rect class="node" x="60" y="350" width="280" height="48" rx="8"/>
  <text class="t" x="200" y="379" text-anchor="middle">Final review</text>
  <rect class="node" x="60" y="438" width="280" height="48" rx="8"/>
  <text class="t" x="200" y="467" text-anchor="middle">PR (default closeout)</text>
  <rect class="node" x="480" y="147" width="170" height="48" rx="8"/>
  <text class="t" x="565" y="176" text-anchor="middle">Promote to Quick</text>
</svg>
